# RoleBinding for TestCast Runner
# Usage: kubectl apply -f infra/k8s/rolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: testcast-rolebinding
  namespace: testcast
  labels:
    app: testcast
subjects:
  - kind: ServiceAccount
    name: testcast-runner
    namespace: testcast
roleRef:
  kind: Role
  name: testcast-role
  apiGroup: rbac.authorization.k8s.io
