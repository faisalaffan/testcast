# Secret for TestCast Credentials (Optional)
# Usage: kubectl apply -f infra/k8s/secret.yaml
# Note: Add actual credentials via: kubectl create secret generic e2e-secrets --from-literal=USERNAME=xxx --from-literal=PASSWORD=yyy
apiVersion: v1
kind: Secret
metadata:
  name: testcast-secrets
  namespace: testcast
  labels:
    app: testcast
type: Opaque
stringData:
  # Uncomment and set actual values:
  # SAUCE_USERNAME: "your-username"
  # SAUCE_ACCESS_KEY: "your-access-key"
  # API_TOKEN: "your-gitlab-token"
