# Role for TestCast Runner - minimal permissions
# Usage: kubectl apply -f infra/k8s/role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: testcast-role
  namespace: testcast
  labels:
    app: testcast
rules:
  # Allow reading pods for debugging/logging
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Allow accessing services if testing internal endpoints
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
